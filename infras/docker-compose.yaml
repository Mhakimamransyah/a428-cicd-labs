version: '3.7'

volumes:
  jenkins-data: 
    driver: overlay2
  jenkins-docker-certs:
    driver: overlay2

networks:
  jenkins-net:
    driver: bridge

services:
  docker-dind:
    image: docker:dind
    container_name: jenkins-docker
    environment:
      DOCKER_TLS_CERTDIR: ./certs
    restart: always
    networks:
      - jenkins-net
    volumes:
      - jenkins-docker-certs:/certs/client
      - jenkins-data:/var/jenkins_home
    ports:
      - 2376:2376
      - 3000:3000
      - 5000:5000
  
  jenkins:
    image: myjenkins-blueocean:2.426.2-1
    container_name: jenkins-blueocean
    networks:
      - jenkins-net
    environment:
      DOCKER_HOST: tcp://docker:2376
      DOCKER_CERT_PATH :
      DOCKER_TLS_VERIFY: 1
      JAVA_OPTS: "-Dhudson.plugins.git.GitSCM.ALLOW_LOCAL_CHECKOUT=true"
    restart: on-failure
    ports:
      - 49000:8080
      - 50000:50000
    depends_on:
      - docker-dind
    volumes:
      - jenkins-data:/var/jenkins_home
      - jenkins-docker-certs:/var/jenkins_home/.docker
    
  nginx:
    image: nginx:latest
    container_name: nginx
    depends_on:
      - jenkins
    ports:
      - 9000:9000
      - 80:80
    networks:
      - jenkins-net
    volumes:
      - ./nginx/:/etc/nginx/conf.d/
  
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    depends_on:
      - jenkins
    networks:
      - jenkins-net
    ports:
      - 9091:9090
    volumes:
      - ./prometheus-config/:/etc/prometheus/
  
  grafana:
    image: grafana/grafana
    container_name: grafana
    depends_on:
      - prometheus
    networks:
      - jenkins-net
    environment:
      - GF_SERVER_HTTP_PORT=3030
    ports:
      - 3031:3030